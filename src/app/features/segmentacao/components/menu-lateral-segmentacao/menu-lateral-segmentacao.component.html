<div class="sidebar">
  <h4>Área de Configuração</h4>
  <div class="section-header">Criar Processo</div>

  <div class="form-check">
    <input class="form-check-input" type="checkbox" id="aleatorio" [(ngModel)]="aleatorioChecked" (change)="marcarAleatorio($event)"/>
    <label class="form-check-label" for="aleatorio">
      Gerar processo com valores aleatórios?
    </label>
  </div>

  <div class="form-group">
    <input type="text" id="processo" class="form-control" placeholder="Processo*" [(ngModel)]="processo" [disabled]="aleatorioChecked">
  </div>

  <div class="form-group">
    <input type="text" id="codigo" class="form-control" placeholder="Código*" [(ngModel)]="codigo" [disabled]="aleatorioChecked">
  </div>

  <div class="form-group">
    <input type="text" id="dados" class="form-control" placeholder="Dados*" [(ngModel)]="dados" [disabled]="aleatorioChecked">
  </div>

  <div class="form-group">
    <input type="text" id="pilha" class="form-control" placeholder="Pilha*" [(ngModel)]="pilha" [disabled]="aleatorioChecked">
  </div>

  <div class="form-group">
    <select id="exercicio" class="form-control">
      <option value="" disabled selected hidden>Selecionar Exercício</option>
      <option value="tabela">Preencher Tabela de Segmentos</option>
      <option value="memoria">Preencher Memória Física</option>
    </select>
  </div>

  <div class="btn-group">
    <button class="btn btn-success" (click)="cadastrar()">Cadastrar</button>
    <button class="btn btn-danger" (click)="cancelar()">Cancelar</button>
  </div>

  <div class="lista-de-processos">
    <div>lista de processos</div>
  </div>
</div>
