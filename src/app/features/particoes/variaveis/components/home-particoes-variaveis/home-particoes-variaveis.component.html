<os-sim-shell
  title="Partições Variáveis"
  subtitle="Alocação contígua dinâmica: compare first, best, worst e circular-fit e veja a fragmentação externa."
>
  <ng-container slot="actions">
    <os-button-group>
      <button class="osbg-btn primary" type="button" aria-label="Criar processo aleatório" title="Criar processo aleatório" (click)="sim.gerarAleatorio()"><i class="fa-solid fa-plus"></i></button>
      <button class="osbg-btn" type="button" aria-label="Compactar memória" title="Compactar memória" (click)="sim.compactar()"><i class="fa-solid fa-compress"></i></button>
      <button class="osbg-btn danger" type="button" aria-label="Reiniciar simulação" title="Reiniciar" (click)="sim.reiniciar()"><i class="fa-solid fa-rotate-right"></i></button>
    </os-button-group>
  </ng-container>
  <app-lateral-particoes-variaveis slot="config"></app-lateral-particoes-variaveis>
  <app-area-particoes-variaveis></app-area-particoes-variaveis>
</os-sim-shell>
